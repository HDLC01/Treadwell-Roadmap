# nginx server block for roadmap.wetreadwell.com
# Place at /etc/nginx/sites-available/roadmap.wetreadwell.com, symlink into
# sites-enabled, then run certbot --nginx (it rewrites this to add 443 + redirect).
server {
    listen 80;
    listen [::]:80;
    server_name roadmap.wetreadwell.com;

    # certbot http-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8892;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    access_log /var/log/nginx/roadmap.access.log;
    error_log  /var/log/nginx/roadmap.error.log;
}
